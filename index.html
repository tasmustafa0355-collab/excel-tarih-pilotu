<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bestseller Excel Tarih Pilotu</title>
  <link rel="stylesheet" href="panel.css">
  <script defer src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="panel.js"></script>
  <script defer src="manifest-download.js"></script>
</head>
<body>
  <main>
    <h1>Bestseller tarih testi</h1>
    <p id="status" role="status">Excel bağlantısı bekleniyor…</p>
    <p>Sheet2 veya Sheet3 açıkken paneli başlat. P, R, U, X veya Z sütunundaki boş bir test hücresine tarih gir. Algılanan giriş burada görünür.</p>
    <ul id="events" aria-label="Algılanan girişler"></ul>
    <section id="setup" hidden>
      <button id="download" type="button">manifest.xml indir</button>
    </section>
  </main>
</body>
</html>
