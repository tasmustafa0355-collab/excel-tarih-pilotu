<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bestseller Excel Tarih Pilotu</title>
  <link rel="stylesheet" href="panel.css">
  <script defer src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="excel-transfer-rules.js?v=2.0.0"></script>
  <script defer src="excel-batch.js?v=2.0.0"></script>
  <script defer src="panel.js?v=2.0.0"></script>
  <script defer src="manifest-download.js"></script>
</head>
<body>
  <main>
    <h1>Bestseller tarih testi</h1>
    <p id="status" role="status">Excel bağlantısı bekleniyor…</p>
    <section id="transfer" hidden>
      <h2>Bekleyen tarihler <span id="pending-count">0</span></h2>
      <p id="instructions">P, R, U, X veya Z sütununa tarih gir. Paneli kapatmadan önce aktarımı tamamla.</p>
      <ul id="events" aria-label="Bekleyen tarihler"></ul>
      <div class="actions">
        <button id="preview" type="button" disabled>Önizleme</button>
        <button id="send" type="button" disabled>Gönder</button>
      </div>
      <section id="report" hidden>
        <h2>Sonuç</h2>
        <p id="report-status" role="status"></p>
        <ul id="report-rows"></ul>
      </section>
    </section>
    <section id="setup" hidden>
      <button id="download" type="button">manifest.xml indir</button>
    </section>
  </main>
</body>
</html>
